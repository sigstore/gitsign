project_name: gitsign
version: 2

# Release for everything except the darwin gitsign binary, which needs cgo and
# is built on a macOS runner by .goreleaser-darwin.yaml, and the container
# image (.goreleaser-image.yaml). Both release configs publish into the same
# draft release - see .github/workflows/release.yml.

gomod:
  proxy: true

builds:
  - id: gitsign
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - freebsd
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w"
      - "-extldflags=-zrelro"
      - "-extldflags=-znow"
      - "-buildid= -X github.com/sigstore/gitsign/pkg/version.gitVersion={{ .Version }}"

  - id: gitsign-credential-cache
    mod_timestamp: '{{ .CommitTimestamp }}'
    main: ./cmd/gitsign-credential-cache
    binary: gitsign-credential-cache
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - freebsd
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w"
      - "-extldflags=-zrelro"
      - "-extldflags=-znow"
      - "-buildid= -X github.com/sigstore/gitsign/pkg/version.gitVersion={{ .Version }}"

nfpms:
  - id: default
    package_name: gitsign
    vendor: Sigstore
    homepage: https://github.com/sigstore/gitsign
    maintainer: Billy Lynch <info@sigstore.dev>
    description: Keyless git commit signing using OIDC identity
    ids:
      - gitsign
      - gitsign-credential-cache
    formats:
      - apk
      - deb
      - rpm

archives:
  - id: binary
    formats:
      - binary
    allow_different_binary_count: true

checksum:
  name_template: 'checksums.txt'

source:
  enabled: true

sboms:
  - id: binaries
    artifacts: binary
  - id: packages
    artifacts: package

signs:
  - cmd: cosign
    env:
      - COSIGN_YES=true
    signature: '${artifact}.bundle'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
    artifacts: binary
    output: true

release:
  prerelease: allow
  draft: true # allow for manual edits
  # The draft is created up front by the release workflow so the per-OS
  # release jobs can upload into it concurrently.
  use_existing_draft: true
  mode: replace # this config owns the release notes
  github:
    owner: sigstore
    name: gitsign
  footer: |
    ### Thanks to all contributors!
