name: validate-release

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

jobs:
  validate-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: 'false'

      - uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # This job only validates that the release config still works end to end,
      # so there is no value in cross-compiling every os/arch pair. Trim the
      # matrix to a single target to keep the job fast. `goreleaser release`
      # has no --single-target flag, and templates are not supported in
      # builds.targets, so patch the config in place instead.
      - name: Reduce build matrix to linux/amd64
        run: |
          yq -i '
            .builds[].goos = ["linux"] |
            .builds[].goarch = ["amd64"]
          ' .goreleaser.yaml
          yq -i '.kos[].platforms = ["linux/amd64"]' .goreleaser-image.yaml

      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0.24.3
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: latest
          args: release --clean --snapshot --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: latest
          args: release --clean --snapshot --config .goreleaser-image.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-release-darwin:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: 'false'

      - uses: anchore/sbom-action/download-syft@v0.24.3
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: latest
          args: release --clean --snapshot --skip=sign --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Make sure the release binaries were built with cgo and include native
      # Keychain support.
      - name: Verify Keychain support
        run: |
          for bin in dist/gitsign-darwin_darwin_*/gitsign; do
            file "${bin}"
            otool -L "${bin}" | grep -q Security.framework
          done
