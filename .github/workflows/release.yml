name: release

# run only on tags
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # Create the draft release up front so both per-OS release jobs below
  # upload into the same draft (and to refuse re-releasing over a published
  # release).
  draft:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to write releases

    steps:
      - name: Create draft release
        run: |
          # goreleaser's use_existing_draft only matches drafts, so a
          # published release would make each matrix leg create its own new
          # draft. Reuse an existing draft (e.g. on re-run), but refuse to
          # release over a published one.
          if is_draft=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::release ${GITHUB_REF_NAME} is already published; convert it back to a draft to re-run the release"
              exit 1
            fi
            echo "reusing existing draft release ${GITHUB_REF_NAME}"
          else
            # The title must match goreleaser's release name ({{ .Tag }}) for
            # use_existing_draft to find it.
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: draft

    strategy:
      fail-fast: false
      # Run one leg at a time: each goreleaser run read-modify-writes the
      # release metadata, so concurrent legs could clobber the release notes
      # with a stale body. Order doesn't matter - the second leg sees the
      # first's update.
      max-parallel: 1
      matrix:
        include:
          # linux, windows, freebsd, gitsign-credential-cache, packages, and
          # release notes.
          - runs-on: ubuntu-latest
            config: .goreleaser.yaml
          # darwin gitsign, built with cgo for native Keychain support.
          - runs-on: macos-latest
            config: .goreleaser-darwin.yaml

    runs-on: ${{ matrix.runs-on }}

    permissions:
      contents: write # needed to write releases
      id-token: write # needed for keyless signing

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # this is important, otherwise it won't checkout the full tree (i.e. no previous tags)

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: 'false'

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0.24.3

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          args: release --clean --config ${{ matrix.config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The container image doesn't depend on the binaries, so it's published in
  # parallel with them with only the permissions it needs - but only once the
  # draft job has accepted the tag, so re-running against a published release
  # can't overwrite the released image tag.
  image:
    needs: draft

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # needed for keyless signing
      packages: write # needed for push images
      attestations: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # this is important, otherwise it won't checkout the full tree (i.e. no previous tags)

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: 'false'

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Login to GitHub Containers
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7.2.3
        id: goreleaser
        with:
          version: latest
          args: release --clean --config .goreleaser-image.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/sigstore/gitsign

      # Use the digest goreleaser pushed rather than re-resolving the tag.
      - name: get the digest
        id: digest
        run: |
          digest=$(jq -r '.[] | select(.type == "Docker Manifest" and .extra.ID == "gitsign") | .extra.Digest' <<<"${ARTIFACTS}")
          if [[ -z "${digest}" ]]; then
            echo "no gitsign image digest in goreleaser artifacts" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}

      - name: sign image
        run: |
          cosign sign "ghcr.io/sigstore/gitsign@${DIGEST_TO_SIGN}"
        env:
          DIGEST_TO_SIGN: ${{ steps.digest.outputs.digest }}
          COSIGN_YES: true

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/sigstore/gitsign
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
